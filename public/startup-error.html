<!doctype html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Serveur indisponible</title><link rel="stylesheet" href="style.css"></head><body class="startup-page"><main class="startup-card error-card"><div class="startup-logo">!</div><h1>Le serveur local est indisponible</h1><p id="errorMessage">Une erreur est survenue.</p><button id="restartServer" class="button primary" type="button">Redémarrer le serveur</button></main><script>const message=new URLSearchParams(location.search).get('message');if(message)document.getElementById('errorMessage').textContent=message;document.getElementById('restartServer').addEventListener('click',async()=>{const button=document.getElementById('restartServer');button.disabled=true;button.textContent='Redémarrage…';try{await window.electronApi?.restartServer()}finally{button.disabled=false;button.textContent='Redémarrer le serveur'}})</script></body></html>
